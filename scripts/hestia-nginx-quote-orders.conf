# HestiaCP custom include — rodolforomao.com.br
# Arquivos: nginx.ssl.conf_quote_orders e nginx.conf_quote_orders
#
# quote_orders_server.py (:8771) — cotações BRL → cripto (SQLite)

location /api/quote-orders {
    proxy_pass         http://127.0.0.1:8771;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
