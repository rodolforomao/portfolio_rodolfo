# HestiaCP custom include — rodolforomao.com.br
# Arquivos: nginx.ssl.conf_portfolio e nginx.conf_portfolio
# (incluídos automaticamente via nginx*.conf_*, mesmo mecanismo do hestia-nginx-vault.conf)
#
# Isolado do vault/relay de propósito: processo e porta próprios (8767), nenhuma
# credencial/rota compartilhada com vault_server.py/ws_relay_server.py.

location /api/portfolio/ {
    proxy_pass         http://127.0.0.1:8767;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
