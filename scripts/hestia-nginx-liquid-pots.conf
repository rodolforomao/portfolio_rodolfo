# HestiaCP custom include — rodolforomao.com.br
# Arquivos: nginx.ssl.conf_liquid_pots e nginx.conf_liquid_pots
#
# liquid_pots_server.py (:8770) — potes Liquid TX + alertas Telegram
# (mesmo TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID do Dealer).

location /api/liquid-pots/ {
    proxy_pass         http://127.0.0.1:8770;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location = /api/liquid-pots {
    return 301 /api/liquid-pots/;
}
