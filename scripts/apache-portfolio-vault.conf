# Snippet Apache — incluir no VirtualHost de rodolforomao.com.br
# ANTES das regras SPA (.htaccess / FallbackResource).
#
# Requer: a2enmod proxy proxy_http proxy_wstunnel rewrite
#
# Instalação (exemplo):
#   sudo cp scripts/apache-portfolio-vault.conf /etc/apache2/conf-available/portfolio-vault.conf
#   sudo a2enconf portfolio-vault
#   sudo systemctl reload apache2

# WebSocket vault (manager_dealer vault_ws_client)
ProxyPass        /vault-ws  ws://127.0.0.1:8766/vault-ws
ProxyPassReverse /vault-ws  ws://127.0.0.1:8766/vault-ws

# WebSocket relay (browser + manager_dealer)
ProxyPass        /dealer-ws  ws://127.0.0.1:8765/dealer-ws
ProxyPassReverse /dealer-ws  ws://127.0.0.1:8765/dealer-ws

# HTTP vault API
ProxyPass        /admin/vault/  http://127.0.0.1:8766/admin/vault/
ProxyPassReverse /admin/vault/  http://127.0.0.1:8766/admin/vault/

ProxyPass        /api/vault/  http://127.0.0.1:8766/api/vault/
ProxyPassReverse /api/vault/  http://127.0.0.1:8766/api/vault/
