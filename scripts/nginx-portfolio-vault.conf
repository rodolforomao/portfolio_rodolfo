# Snippet nginx — incluir no server {} de rodolforomao.com.br
# ANTES do location / que serve o build React (catch-all SPA).
#
# Instalação:
#   sudo cp scripts/nginx-portfolio-vault.conf /etc/nginx/snippets/portfolio-vault.conf
#   echo 'include snippets/portfolio-vault.conf;' >> /etc/nginx/sites-available/rodolforomao.com.br
#   sudo nginx -t && sudo systemctl reload nginx

location /vault-ws {
    proxy_pass         http://127.0.0.1:8766;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
}

location /dealer-ws {
    proxy_pass         http://127.0.0.1:8765;
